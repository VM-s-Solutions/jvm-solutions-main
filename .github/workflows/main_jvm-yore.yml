# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jvm-yore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      # NX local computation cache — skips re-building unchanged targets
      - name: Restore NX cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (NX)
        run: |
          npx nx build jvm-solutions --configuration production
          node scripts/compress-build.js

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Install and build API
        working-directory: api
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            api/dist/
            node_modules/
            server.js
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EB1E6E8527DF42F5B307B0F821EECFFA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F0A8150CBFA74D81BBFA6959B76FC88A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E844E1E4CB2E47CF9EA7936ADB8E46F6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jvm-yore'
          slot-name: 'Production'
          package: .

      - name: Configure Azure App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'jvm-yore'
          app-settings-json: |
            [
              { "name": "RESEND_API_KEY",       "value": "${{ secrets.RESEND_API_KEY }}",       "slotSetting": false },
              { "name": "CONTACT_TO_EMAIL",     "value": "${{ secrets.CONTACT_TO_EMAIL }}",     "slotSetting": false },
              { "name": "CONTACT_FROM_EMAIL",   "value": "${{ secrets.CONTACT_FROM_EMAIL }}",   "slotSetting": false },
              { "name": "TURNSTILE_SECRET_KEY", "value": "${{ secrets.TURNSTILE_SECRET_KEY }}", "slotSetting": false }
            ]
