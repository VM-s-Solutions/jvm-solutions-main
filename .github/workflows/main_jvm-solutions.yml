# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jvm-solutions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install and build
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Install and build API
        working-directory: api
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            api/dist/
            server.js
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jvm-solutions'
          slot-name: 'Production'
          package: .

      - name: Configure Azure Function App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'jvm-solutions'
          app-settings-json: |
            [
              { "name": "RESEND_API_KEY",         "value": "${{ secrets.RESEND_API_KEY }}",         "slotSetting": false },
              { "name": "CONTACT_TO_EMAIL",       "value": "${{ secrets.CONTACT_TO_EMAIL }}",       "slotSetting": false },
              { "name": "CONTACT_FROM_EMAIL",     "value": "${{ secrets.CONTACT_FROM_EMAIL }}",     "slotSetting": false },
              { "name": "TURNSTILE_SECRET_KEY",   "value": "${{ secrets.TURNSTILE_SECRET_KEY }}",   "slotSetting": false }
            ]
