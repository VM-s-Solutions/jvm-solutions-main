<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JVM Yore — Frontend, Backend, Mobile &amp; AI Development</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JVM Yore — We build world-class Frontend, Backend, Mobile Apps and AI Automation solutions for forward-thinking companies.">
  <meta property="og:title" content="JVM Yore">
  <meta property="og:description" content="We build world-class Frontend, Backend, Mobile Apps and AI Automation solutions.">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://jvm-yore.com/og-image.png">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JVM Yore — Frontend, Backend, Mobile &amp; AI Development">
  <meta name="twitter:description" content="We build world-class Frontend, Backend, Mobile Apps and AI Automation solutions.">
  <meta name="twitter:image" content="https://jvm-yore.com/og-image.png">
  <link rel="canonical" href="https://jvm-yore.com/">

  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Locale preload: detect browser language early and prefetch the right translation
       file so it downloads in parallel with main.js instead of after Angular boots. -->
  <script>(function(){try{var s=localStorage.getItem('lang'),b=(navigator.language||'').split('-')[0].toLowerCase(),l=s&&['cs','sk','uk'].includes(s)?s:['cs','sk','uk'].includes(b)?b:null;if(l){var e=document.createElement('link');e.rel='preload';e.as='fetch';e.href='/i18n/'+l+'.json';e.crossOrigin='';document.head.appendChild(e);}}catch(e){}})();</script>
  <!-- Theme: apply before first paint to prevent flash of wrong theme. Default is always dark. -->
  <script>(function(){try{var t=localStorage.getItem('theme');document.documentElement.dataset.theme=(t==='light'||t==='dark')?t:'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
  <!-- Fonts: preconnect first, then load async (non-render-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"></noscript>
  <!-- Cloudflare Turnstile — render=explicit so we control when widgets mount -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
