  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">

  <!-- Turnstile queue — must be defined BEFORE the api.js script loads so the onload callback exists -->
  <script>
    window._turnstileQueue = [];
    window.onTurnstileReady = function() {
      var q = window._turnstileQueue || [];
      window._turnstileQueue = [];
      q.forEach(function(fn) { fn(); });
    };
  </script>
  <!-- Cloudflare Turnstile — render=explicit so we control when widgets mount -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileReady" async defer></script>
