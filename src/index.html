  <!-- Locale preload: picks the language the way initial-lang.ts does (saved choice, else the browser's,
       else English) and preloads its file, so it downloads in parallel with main.js instead of after
       Angular boots; English needs none, it ships in main.js. Landing on a legal page (the routes with
       the legalStrings resolver in app.routes.ts) also preloads that language's legal strings. The app
       reads both with a bare fetch(), which reuses these preloads. -->
  <script>(function(){var L=['en','cs','sk','uk'],s=null,b=(navigator.language||'').split('-')[0].toLowerCase(),l;try{s=localStorage.getItem('lang');}catch(e){}l=L.indexOf(s)>-1?s:L.indexOf(b)>-1?b:'en';function p(h){var e=document.createElement('link');e.rel='preload';e.as='fetch';e.href=h;e.crossOrigin='';document.head.appendChild(e);}if(l!=='en')p('/i18n/'+l+'.json');if(['privacy','terms','refunds'].indexOf(location.pathname.split('/')[1])>-1)p('/i18n/legal/'+l+'.json');})();</script>
  <!-- Fonts (self-hosted): a first visit fetches them only after first contentful paint, so the
       woff2 files never compete with the app's own JS; once cached they load straight away, so
       repeat visits paint in the right font. Browsers without paint timing load them on window load. -->
  <script>(function(){function f(){var l=document.createElement('link');l.rel='stylesheet';l.href='fonts.css';document.head.appendChild(l);try{localStorage.setItem('fontsCached','1');}catch(e){}}var c=null;try{c=localStorage.getItem('fontsCached');}catch(e){}var P=window.PerformanceObserver;if(c){f();}else if(P&&P.supportedEntryTypes&&P.supportedEntryTypes.indexOf('paint')>-1){var o=new P(function(list){if(list.getEntriesByName('first-contentful-paint').length){o.disconnect();f();}});o.observe({type:'paint',buffered:true});}else{addEventListener('load',f);}})();</script>
