<section class="hero" aria-label="Hero">

  <div class="hero__inner container">

    <!-- Eyebrow -->
    <p class="hero__eyebrow">{{ 'hero.eyebrow' | translate }}</p>

    <!-- Headline -->
    <h1 class="hero__headline">
      {{ 'hero.headlinePart1' | translate }}<br>
      <span class="hero__typewriter" aria-live="polite" aria-atomic="true"
        >{{ typedText() }}<span class="hero__cursor" aria-hidden="true">|</span></span>
    </h1>

    <!-- Description -->
    <p class="hero__description">
      {{ 'hero.description' | translate }}
    </p>

    <!-- Single editorial CTA -->
    <a class="hero__cta" routerLink="/contact">
      {{ 'hero.ctaPrimary' | translate }}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>

  </div>

  <!-- Scroll indicator -->
  <div class="hero__scroll" aria-hidden="true">
    <div class="hero__scroll-line"></div>
  </div>

</section>
