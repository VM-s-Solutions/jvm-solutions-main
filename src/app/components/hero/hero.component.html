<section class="hero">
  <div class="container hero__in">
    <div class="hero__copy">
      <h1 class="display hero__title" [jvmSplit]="titleKey() | translate: titleParams()"></h1>
      <p class="lead" jvmReveal="lift" [revealDelay]="0.35">{{ 'hero.lead' | translate }}</p>
      <div class="actions" jvmReveal="lift" [revealDelay]="0.45">
        <a class="btn btn--primary" routerLink="/contact">
          <span>{{ 'hero.cta' | translate }}</span>
          <jvm-icon name="arrow" />
        </a>
        <button class="btn btn--ghost" type="button" (click)="seeHow()">
          <span>{{ 'hero.secondary' | translate }}</span>
        </button>
      </div>
    </div>

    <jvm-chat jvmReveal="up" [revealDelay]="0.15" />
  </div>
</section>
