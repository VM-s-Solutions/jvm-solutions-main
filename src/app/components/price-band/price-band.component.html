<section class="section section--ink" id="price" aria-labelledby="price-title" jvmDarkSurface>
  <div class="container price">
    <div class="price__copy">
      <h2 class="h2" id="price-title" [jvmSplit]="'price.title' | translate"></h2>
      <p class="sec-head__p" jvmReveal>{{ 'price.lead' | translate }}</p>
      <a class="link" routerLink="/pricing" jvmReveal>{{ 'price.compare' | translate }}<jvm-icon name="arrow" /></a>
    </div>

    <jvm-price-dial jvmReveal="up" [revealDelay]="0.1" />
  </div>
</section>
