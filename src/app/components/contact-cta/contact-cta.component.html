<section class="cta" aria-labelledby="cta-title">
  <div class="cta__bg" aria-hidden="true">
    <div class="cta__orb cta__orb--left"></div>
    <div class="cta__orb cta__orb--right"></div>
  </div>

  <div class="container cta__content" appScrollReveal revealClass="reveal">
    <div class="cta__text">
      <span class="section-label">{{ 'cta.sectionLabel' | translate }}</span>
      <h2 id="cta-title" class="cta__title">
        {{ 'cta.title1' | translate }}<br>
        {{ 'cta.title2' | translate }} <span class="gradient-text">{{ 'cta.titleGrad' | translate }}</span>
      </h2>
      <p class="cta__description">
        {{ 'cta.description' | translate }}
      </p>
    </div>

    <div class="cta__actions">
      <a class="btn-primary cta__btn" routerLink="/contact">
        {{ 'cta.btn' | translate }}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
      <a class="cta__email" href="mailto:hello@jvm-solutions.dev">
        hello&#64;jvm-solutions.dev
      </a>
    </div>
  </div>
</section>
