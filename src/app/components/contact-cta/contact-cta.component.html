<section class="cta" aria-labelledby="cta-title">
  <div class="container">
    <div class="cta__inner" appScrollReveal revealClass="reveal">

      <div class="cta__left">
        <h2 id="cta-title" class="cta__title">{{ 'cta.title' | translate }}</h2>
        <p class="cta__description">{{ 'cta.description' | translate }}</p>
      </div>

      <div class="cta__right">
        <a href="mailto:hello@jvm-yore.com" class="cta__email">hello&#64;jvm-yore.com</a>
        <p class="cta__meta">
          <span>{{ 'contact.responseValue' | translate }}</span>
          <span class="cta__meta-dot" aria-hidden="true">·</span>
          <span>{{ 'contact.locationValue' | translate }}</span>
        </p>
      </div>

    </div>
  </div>
</section>
