<section class="cta" aria-labelledby="cta-title">
  <div class="container cta__content" appScrollReveal revealClass="reveal">

    <p class="cta__eyebrow">{{ 'cta.sectionLabel' | translate }}</p>

    <h2 id="cta-title" class="cta__title">
      {{ 'cta.title1' | translate }}<br>
      {{ 'cta.title2' | translate }} <span class="gradient-text">{{ 'cta.titleGrad' | translate }}</span>
    </h2>

    <p class="cta__description">
      {{ 'cta.description' | translate }}
    </p>

    <a class="btn-primary cta__btn" routerLink="/contact">
      {{ 'cta.btn' | translate }}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>

  </div>
</section>
