<section class="stats" aria-label="Key statistics">
  <div class="container">
    <div class="stats__grid">
      @for (stat of stats; track stat.labelKey; let i = $index) {
        <div class="stats__item">
          <div class="stats__number">
            <span class="stats__value">{{ displayValues()[i] }}</span>
            <span class="stats__suffix">{{ stat.suffix }}</span>
          </div>
          <p class="stats__label">{{ stat.labelKey | translate }}</p>
        </div>
        @if (!$last) {
          <div class="stats__divider" aria-hidden="true"></div>
        }
      }
    </div>
  </div>
</section>
