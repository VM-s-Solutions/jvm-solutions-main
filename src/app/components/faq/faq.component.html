<section class="faq" id="faq" aria-labelledby="faq-title">
  <div class="container">

    <div class="faq__header" appScrollReveal revealClass="reveal">
      <span class="section-label">{{ 'faq.sectionLabel' | translate }}</span>
      <h2 id="faq-title" class="faq__title">
        {{ 'faq.title1' | translate }} <span class="gradient-text">{{ 'faq.titleGrad' | translate }}</span>
      </h2>
    </div>

    <div class="faq__list" appScrollReveal revealClass="reveal">
      @for (item of items; track item.qKey; let i = $index) {
        <div class="faq__item" [class.is-open]="openIndex() === i">
          <button
            class="faq__question"
            (click)="toggle(i)"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-answer-' + i"
          >
            <span>{{ item.qKey | translate }}</span>
            <svg class="faq__chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6,9 12,15 18,9"/>
            </svg>
          </button>
          <div
            #answer
            class="faq__answer"
            [id]="'faq-answer-' + i"
            role="region"
            [attr.aria-hidden]="openIndex() !== i"
          >
            <div class="faq__answer-inner">
              <p>{{ item.aKey | translate }}</p>
            </div>
          </div>
        </div>
      }
    </div>

  </div>
</section>
