<section class="faq" id="faq" aria-labelledby="faq-title">
  <div class="container">
    <div class="faq__layout">

      <header class="faq__intro" appScrollReveal revealClass="reveal">
        <span class="section-label">{{ 'faq.sectionLabel' | translate }}</span>
        <h2 id="faq-title" class="faq__title">
          {{ 'faq.title1' | translate }} <span class="gradient-text">{{ 'faq.titleGrad' | translate }}</span>
        </h2>
        <p class="faq__subtitle">{{ 'faq.subtitle' | translate }}</p>

        <div class="faq__more">
          <p class="faq__more-label">{{ 'faq.more' | translate }}</p>
          <a routerLink="/contact" class="faq__more-link">
            <span>{{ 'faq.moreLink' | translate }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12,5 19,12 12,19"/>
            </svg>
          </a>
        </div>
      </header>

      <div class="faq__list" appScrollReveal revealClass="reveal">
        @for (item of items; track item.qKey; let i = $index) {
          <div class="faq__item" [class.is-open]="openIndex() === i">
            <button
              type="button"
              class="faq__question"
              [id]="'faq-question-' + i"
              (click)="toggle(i)"
              [attr.aria-expanded]="openIndex() === i"
              [attr.aria-controls]="'faq-answer-' + i"
            >
              <span class="faq__num" aria-hidden="true">0{{ i + 1 }}</span>
              <span class="faq__question-text">{{ item.qKey | translate }}</span>
              <span class="faq__icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <line x1="7" y1="1" x2="7" y2="13"/>
                  <line x1="1" y1="7" x2="13" y2="7"/>
                </svg>
              </span>
            </button>
            <div
              #answer
              class="faq__answer"
              [id]="'faq-answer-' + i"
              role="region"
              [attr.aria-labelledby]="'faq-question-' + i"
              [attr.aria-hidden]="openIndex() !== i"
            >
              <div class="faq__answer-inner">
                <p>{{ item.aKey | translate }}</p>
              </div>
            </div>
          </div>
        }
      </div>

    </div>
  </div>
</section>
