<section class="faq" id="faq" aria-labelledby="faq-title">
  <div class="container">

    <header class="faq__header" appScrollReveal revealClass="reveal">
      <span class="section-label">{{ 'faq.sectionLabel' | translate }}</span>
      <h1 id="faq-title" class="faq__title">
        {{ 'faq.title1' | translate }} <span class="text-accent">{{ 'faq.titleGrad' | translate }}</span>
      </h1>
      <p class="faq__subtitle">{{ 'faq.subtitle' | translate }}</p>
    </header>

    <div class="faq__list" appScrollReveal revealClass="reveal">
      @for (item of items; track item.qKey; let i = $index) {
        <div class="faq__item" [class.is-open]="openItems().has(i)">
          <h2 class="faq__heading">
            <button
              type="button"
              class="faq__question"
              [id]="'faq-question-' + i"
              (click)="toggle(i)"
              [attr.aria-expanded]="openItems().has(i)"
              [attr.aria-controls]="'faq-answer-' + i"
            >
              <span class="faq__question-text">{{ item.qKey | translate }}</span>
              <svg class="faq__chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
          </h2>
          <div
            class="faq__answer"
            [id]="'faq-answer-' + i"
            role="region"
            [attr.aria-labelledby]="'faq-question-' + i"
            [attr.inert]="openItems().has(i) ? null : ''"
          >
            <div class="faq__answer-inner">
              <p>{{ item.aKey | translate }}</p>
            </div>
          </div>
        </div>
      }
    </div>

    <p class="faq__more" appScrollReveal revealClass="reveal">
      <span>{{ 'faq.more' | translate }}</span>
      <a routerLink="/contact" class="faq__more-link">
        {{ 'faq.moreLink' | translate }}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </p>

  </div>
</section>
