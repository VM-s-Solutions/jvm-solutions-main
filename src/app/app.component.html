<a class="skip" href="#main" (click)="skipToContent($event)">{{ 'a11y.skipToContent' | translate }}</a>

<jvm-top-bar />
<jvm-tab-bar />

<main #main id="main" tabindex="-1">
  <router-outlet />
</main>

<!-- Focus and screen readers skip an empty placeholder, so the footer doesn't wait for a scroll: it also
     renders at the first Tab, or a few seconds in (pages/home explains the timing) -->
@defer (on viewport; on timer(5000ms); when tabbed(); prefetch on idle) {
  <jvm-footer />
} @placeholder {
  <div class="footer-placeholder"></div>
}
