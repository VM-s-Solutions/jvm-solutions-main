<main id="main-content" class="about-page">
  <div class="about-page__bg" aria-hidden="true">
    <div class="about-page__orb about-page__orb--red"></div>
    <div class="about-page__orb about-page__orb--green"></div>
  </div>

  <div class="about-page__inner container">
    <header class="about-header" appScrollReveal revealClass="reveal">
      <span class="section-label">{{ 'about.sectionLabel' | translate }}</span>
      <h1 class="about-header__title">
        {{ 'about.titlePart1' | translate }} <span class="gradient-text">{{ 'about.titleGrad' | translate }}</span><br>{{ 'about.titlePart2' | translate }}
      </h1>
      <p class="about-header__subtitle">{{ 'about.description' | translate }}</p>
    </header>

    <jvm-team-grid [members]="team" />
  </div>
</main>

@defer (on viewport; prefetch on idle) {
  <jvm-footer />
} @placeholder {
  <div style="min-height:300px"></div>
}
