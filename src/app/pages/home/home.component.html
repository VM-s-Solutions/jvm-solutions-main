<jvm-navbar />

<main id="main-content">
  <jvm-hero />

  <div id="services">
    @defer (on viewport; prefetch on idle) {
      <jvm-services />
    } @placeholder {
      <div style="min-height:700px"></div>
    }
  </div>

  @defer (on viewport) {
    <jvm-how-it-works />
  } @placeholder {
    <div style="min-height:500px"></div>
  }

  @defer (on viewport) {
    <jvm-stats />
  } @placeholder {
    <div style="min-height:180px"></div>
  }

  @defer (on viewport) {
    <jvm-faq />
  } @placeholder {
    <div style="min-height:480px"></div>
  }

  @defer (on viewport) {
    <jvm-contact-cta />
  } @placeholder {
    <div style="min-height:300px"></div>
  }

  @defer (on viewport) {
    <jvm-footer />
  } @placeholder {
    <div style="min-height:300px"></div>
  }
</main>
